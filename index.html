<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Page Unresponsive</title>
</head>
<body>
    <div id="unresponsive-overlay" class="overlay">
        <div class="popup-box">
          <h3>The page is unresponsive</h3>
          <p>You can wait for it to become responsive or exit the page now.</p>
          <div class="popup-buttons">
            <button id="wait-btn" class="btn-wait">Wait</button>
            <button id="exit-btn" class="btn-exit">Exit Page</button>
          </div>
        </div>
      </div>
      <script src="script.js"></script>
</body>
</html>
